version: "3"

vars:
  BUN: bun

dotenv: [".env"]

tasks:
  default:
    desc: แสดงคำสั่งที่ใช้ได้
    cmds:
      - task --list

  install:
    desc: ติดตั้ง dependencies
    cmds:
      - "{{.BUN}} install"

  dev:
    desc: รัน dev server (http://localhost:5100)
    cmds:
      - "{{.BUN}} run dev"

  build:
    desc: build สำหรับ production
    cmds:
      - "{{.BUN}} run build"

  typecheck:
    desc: ตรวจ TypeScript
    cmds:
      - "{{.BUN}} run typecheck"

  preview:
    desc: preview build บนเครื่อง local
    deps: [build]
    cmds:
      - "{{.BUN}} run preview"

  check:
    desc: typecheck + build (ใช้ก่อน commit)
    cmds:
      - task: typecheck
      - task: build

  deploy:
    desc: build และ deploy ไป Cloudflare Pages
    cmds:
      - "{{.BUN}} run deploy"

  deploy:preview:
    desc: build และ preview ด้วย Wrangler (local)
    deps: [build]
    cmds:
      - bunx wrangler pages dev dist

  setup:
    desc: setup ครั้งแรก — ติดตั้ง deps + สร้าง .env ถ้ายังไม่มี
    cmds:
      - task: install
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
          echo "✓ สร้าง .env แล้ว — ใส่ SUPABASE_URL + publishable key (sb_publishable_...) ใน SUPABASE_KEY"
        else
          echo "✓ .env มีอยู่แล้ว"
        fi

  supabase:link:
    desc: เชื่อม Supabase CLI กับ remote project
    cmds:
      - supabase link --project-ref {{.CLI_ARGS}}
    silent: true

  supabase:push:
    desc: push database migrations ขึ้น Supabase
    cmds:
      - supabase db push

  supabase:reset:
    desc: reset database local (Supabase local dev)
    cmds:
      - supabase db reset

  supabase:start:
    desc: รัน Supabase local stack
    cmds:
      - supabase start

  supabase:stop:
    desc: หยุด Supabase local stack
    cmds:
      - supabase stop

  supabase:status:
    desc: แสดง URL / keys ของ Supabase local
    cmds:
      - supabase status

  dev:local:
    desc: เริ่ม Supabase local แล้วรัน Nuxt (ไม่กิน B/W cloud)
    cmds:
      - supabase start
      - |
        eval "$(supabase status -o env)"
        export SUPABASE_URL="$API_URL"
        export SUPABASE_KEY="$ANON_KEY"
        export SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY"
        echo "✓ ใช้ Supabase local: $SUPABASE_URL"
        {{.BUN}} run dev

  clean:
    desc: ลบ build cache และ output
    cmds:
      - rm -rf .nuxt .output dist node_modules/.cache

  notifications:install:
    desc: ติดตั้ง dependencies ของ notifications worker
    dir: workers/notifications
    cmds:
      - "{{.BUN}} install"

  notifications:setup:
    desc: สร้าง workers/notifications/.dev.vars + แสดงวิธีตั้ง Supabase Webhook
    dir: workers/notifications
    cmds:
      - bash scripts/setup-dev-vars.sh

  notifications:webhook-hint:
    desc: แสดง URL และ Authorization สำหรับ Database Webhook (อ่านจาก .dev.vars)
    dir: workers/notifications
    cmds:
      - bash scripts/print-webhook-setup.sh

  notifications:dev:
    desc: รัน notifications worker local (Wrangler dev, webhook + cron)
    dir: workers/notifications
    deps: [notifications:install]
    cmds:
      - "{{.BUN}} run dev"

  notifications:deploy:
    desc: deploy notifications worker ขึ้น Cloudflare
    dir: workers/notifications
    deps: [notifications:install]
    cmds:
      - "{{.BUN}} run deploy"
