# Supabase local development config
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "helm-pm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5100"
additional_redirect_urls = ["http://localhost:5100/confirm"]

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true

[realtime]
enabled = true
